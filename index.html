<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WorkList - Web App สำหรับจดบันทึกการทำงาน พร้อมบอกสถานะ ระยะเวลา และคีย์เวิร์ด">
    <title>WorkList - Task Tracking Web App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header class="app-header">
            <h1>WorkList <span class="subtitle">บันทึกการทำงาน</span></h1>
            <div class="storage-controls">
                <button id="btn-export" class="btn btn-outline" title="บันทึกข้อมูลเป็นไฟล์ JSON (.txt)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Save File
                </button>
                <button id="btn-import" class="btn btn-outline" title="โหลดข้อมูลจากไฟล์ JSON (.txt)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Load File
                </button>
                <input type="file" id="file-input" accept=".txt" style="display: none;">
            </div>
        </header>

        <section class="tasks-section">
            <div class="tasks-header">
                <div class="header-title-row">
                    <h2>Dashboard รายการงาน</h2>
                    <button id="btn-add-task" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        สร้างงานใหม่
                    </button>
                </div>
                <div class="task-stats">
                    <span id="stat-total" class="stat-badge total">Total: 0</span>
                    <span id="stat-progress" class="stat-badge progress">In Progress: 0</span>
                    <span id="stat-completed" class="stat-badge completed">Completed: 0</span>
                </div>
            </div>
            <div id="tasks-list" class="tasks-list">
                <!-- Tasks will be rendered here dynamically -->
                <div class="empty-state">
                    <p>ยังไม่มีรายการงาน เริ่มต้นด้วยการเพิ่มงานใหม่ด้านบน</p>
                </div>
            </div>
        </section>
    </main>

    </main>

    <div id="toast" class="toast"></div>

    <script src="components/TaskModal.js"></script>
    <script src="app.js"></script>
</body>
</html>
